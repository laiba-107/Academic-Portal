<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apply as Mentor – Academic Portal</title>
  <!-- Google Fonts: Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body class="d-flex flex-column min-vh-100">
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">Academic Portal</a>
      <div class="ms-auto">
        <button id="logoutBtn" class="btn btn-outline-light btn-sm d-none">Logout</button>
      </div>
    </div>
  </nav>
  <main class="flex-grow-1 bg-light py-4">
    <div class="container" style="max-width: 600px;">
      <h2 class="mb-4">Mentor Application</h2>
      <div id="infoMsg" class="alert alert-success d-none"></div>
      <div id="errorMsg" class="alert alert-danger d-none"></div>
      <form id="mentorForm">
        <div class="mb-3">
          <label for="fullName" class="form-label">Full Name</label>
          <input type="text" id="fullName" class="form-control" required />
        </div>
        <div class="mb-3">
          <label for="experience" class="form-label">Experience & Qualifications</label>
          <textarea id="experience" class="form-control" rows="4" required></textarea>
        </div>
        <div class="mb-3">
          <label for="additionalInfo" class="form-label">Additional Information (optional)</label>
          <textarea id="additionalInfo" class="form-control" rows="3"></textarea>
        </div>
        <button type="submit" class="btn btn-primary w-100">Submit Application</button>
      </form>
    </div>
  </main>
  <footer class="bg-primary text-white text-center py-3 mt-auto">
    &copy; <span id="year"></span> Student Academic Portal
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="assets/js/dashboard.js"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>

</html>
