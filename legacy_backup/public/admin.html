<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard – Academic Portal</title>
  <!-- Google Fonts: Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body class="d-flex flex-column min-vh-100">
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">Academic Portal</a>
      <div class="d-flex ms-auto">
        <button id="logoutBtn" class="btn btn-outline-light">Logout</button>
      </div>
    </div>
  </nav>
  <main class="flex-grow-1 bg-light py-4">
    <div class="container">
      <h2 class="mb-4">Admin Dashboard</h2>
      <!-- Analytics -->
      <div class="mb-4">
        <h3>System Analytics</h3>
        <div id="analytics" class="row g-3"></div>
      </div>
      <!-- Mentor Applications -->
      <div class="mb-4">
        <h3>Pending Mentor Applications</h3>
        <ul id="mentorApplications" class="list-group"></ul>
      </div>
      <!-- Manage Admissions -->
      <div class="mb-4">
        <h3>Admissions</h3>
        <button class="btn btn-success mb-2" data-bs-toggle="collapse" data-bs-target="#addAdmissionForm">Add
          Admission</button>
        <div id="addAdmissionForm" class="collapse mb-3">
          <form id="admissionForm" class="border p-3 bg-white">
            <div class="row g-2 mb-2">
              <div class="col">
                <input type="text" class="form-control" id="admUniversity" placeholder="University" required />
              </div>
              <div class="col">
                <input type="text" class="form-control" id="admDegree" placeholder="Degree (e.g., Master)" required />
              </div>
            </div>
            <div class="row g-2 mb-2">
              <div class="col">
                <input type="text" class="form-control" id="admLocation" placeholder="Location" required />
              </div>
              <div class="col">
                <input type="date" class="form-control" id="admDeadline" placeholder="Deadline" required />
              </div>
            </div>
            <div class="mb-2">
              <textarea id="admDescription" class="form-control" placeholder="Description" rows="2" required></textarea>
            </div>
            <div class="row g-2 mb-2">
              <div class="col">
                <select id="admFunding" class="form-select" required>
                  <option value="">Funding Type</option>
                  <option value="full">Fully Funded</option>
                  <option value="partial">Partial</option>
                </select>
              </div>
            </div>
            <button type="submit" class="btn btn-primary">Save</button>
          </form>
        </div>
        <ul id="admissionsList" class="list-group"></ul>
      </div>
      <!-- Manage Scholarships -->
      <div class="mb-4">
        <h3>Scholarships</h3>
        <button class="btn btn-success mb-2" data-bs-toggle="collapse" data-bs-target="#addScholarshipForm">Add
          Scholarship</button>
        <div id="addScholarshipForm" class="collapse mb-3">
          <form id="scholarshipForm" class="border p-3 bg-white">
            <div class="row g-2 mb-2">
              <div class="col">
                <input type="text" class="form-control" id="schTitle" placeholder="Title" required />
              </div>
              <div class="col">
                <input type="text" class="form-control" id="schDegree" placeholder="Degree Level" required />
              </div>
            </div>
            <div class="row g-2 mb-2">
              <div class="col">
                <input type="text" class="form-control" id="schLocation" placeholder="Location" required />
              </div>
              <div class="col">
                <input type="text" class="form-control" id="schAmount" placeholder="Funding Amount" required />
              </div>
            </div>
            <div class="row g-2 mb-2">
              <div class="col">
                <input type="number" min="0" class="form-control" id="schGpa" placeholder="Minimum GPA (0-4)" />
              </div>
              <div class="col">
                <input type="date" class="form-control" id="schDeadline" required />
              </div>
            </div>
            <div class="mb-2">
              <textarea id="schDescription" class="form-control" placeholder="Description" rows="2" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Save</button>
          </form>
        </div>
        <ul id="scholarshipsList" class="list-group"></ul>
      </div>
      <!-- Manage Discussions -->
      <div class="mb-4">
        <h3>All Discussions</h3>
        <ul id="allThreads" class="list-group"></ul>
      </div>
    </div>
  </main>
  <footer class="bg-primary text-white text-center py-3 mt-auto">
    &copy; <span id="year"></span> Student Academic Portal
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="assets/js/admin.js"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>

</html>
