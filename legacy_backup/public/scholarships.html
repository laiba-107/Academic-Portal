<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scholarships – Academic Portal</title>
  <!-- Google Fonts: Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body class="d-flex flex-column min-vh-100">
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">Academic Portal</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="admissions.html">Admissions</a></li>
          <li class="nav-item"><a class="nav-link" href="forum.html">Forum</a></li>
        </ul>
        <div class="d-flex">
          <a href="login.html" class="btn btn-outline-light me-2">Login</a>
          <a href="signup.html" class="btn btn-light">Sign Up</a>
        </div>
      </div>
    </div>
  </nav>
  <main class="flex-grow-1 bg-light py-4">
    <div class="container">
      <h2 class="mb-3">Scholarships</h2>
      <form id="filterForm" class="row g-3 mb-3">
        <div class="col-md-3">
          <input type="text" id="filterLocation" class="form-control" placeholder="Location" />
        </div>
        <div class="col-md-3">
          <select id="filterDegree" class="form-select">
            <option value="">All Degrees</option>
            <option value="Bachelor">Bachelor</option>
            <option value="Master">Master</option>
            <option value="PhD">PhD</option>
          </select>
        </div>
        <div class="col-md-3">
          <input type="number" step="0.1" min="0" max="4" id="filterGpa" class="form-control" placeholder="Min GPA" />
        </div>
        <div class="col-md-3">
          <button type="submit" class="btn btn-primary w-100">Apply Filters</button>
        </div>
      </form>
      <div id="scholarshipsList" class="row g-4"></div>
    </div>
  </main>
  <footer class="bg-primary text-white text-center py-3 mt-auto">
    &copy; <span id="year"></span> Student Academic Portal
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="assets/js/scholarships.js"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>

</html>
