<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discussion Forum – Academic Portal</title>
  <!-- Google Fonts: Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body class="d-flex flex-column min-vh-100">
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">Academic Portal</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="admissions.html">Admissions</a></li>
          <li class="nav-item"><a class="nav-link" href="scholarships.html">Scholarships</a></li>
        </ul>
        <div class="d-flex">
          <a href="login.html" class="btn btn-outline-light me-2" id="loginLink">Login</a>
          <a href="signup.html" class="btn btn-light" id="signupLink">Sign Up</a>
          <button class="btn btn-outline-light d-none" id="logoutBtn">Logout</button>
        </div>
      </div>
    </div>
  </nav>
  <main class="flex-grow-1 bg-light py-4">
    <div class="container">
      <h2 class="mb-3">Discussion Forum</h2>
      <div id="newThreadSection" class="mb-4 d-none">
        <h4>Create a New Thread</h4>
        <form id="newThreadForm">
          <div class="mb-2">
            <input type="text" class="form-control" id="threadTitle" placeholder="Thread Title" required />
          </div>
          <div class="mb-2">
            <textarea id="threadContent" class="form-control" rows="3" placeholder="Describe your question or topic"
              required></textarea>
          </div>
          <div class="mb-2">
            <input type="text" id="threadTags" class="form-control" placeholder="Tags (comma‑separated)" />
          </div>
          <button type="submit" class="btn btn-primary">Post Thread</button>
        </form>
      </div>
      <div id="threadsContainer" class="accordion"></div>
    </div>
  </main>
  <footer class="bg-primary text-white text-center py-3 mt-auto">
    &copy; <span id="year"></span> Student Academic Portal
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="assets/js/forum.js"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>

</html>
